[project]
name = "multitalker-asr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cython>=3.2.4",
    "flask>=3.1.3",
    "huggingface-hub>=1.7.1",
    "kaldi-io>=0.9.8",
    "loguru>=0.7.3",
    "nemo-toolkit[asr]",
    "numpy>=1.26.4",
    "onnx<=1.16.1",
    "pandas>=2.3.3",
    "pyctcdecode>=0.5.0",
    "python-dateutil>=2.9.0.post0",
    "python-socketio>=5.16.1",
    "pytorch-lightning==1.9.5",
    "requests>=2.32.5",
    "ruamel-yaml>=0.19.1",
    "setuptools>=65.0.0",
    "torch>=2.0.0",
    "unidecode>=1.4.0",
    "wget>=3.2",
    "wheel>=0.46.3",
    "wrapt>=2.1.2",
]

[tool.uv.sources]
nemo-toolkit = { git = "https://github.com/NVIDIA/NeMo.git", rev = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multitalker_asr"]
