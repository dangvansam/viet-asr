# Fully URL-only pipeline: every model runs as a service, the orchestrator loads
# NO model in-process. Each backend points at a service URL (env-driven), so the
# pipeline venv/image needs only requests+numpy+soundfile. Bring services up with
# `docker compose up` (see docker-compose.yml + .env.example).
pipeline_name: crawl_services
stages:
  - crawl_seed
  - extract_audio
  - vad              # VAD via service
  - vad_diarize      # vad_sv: VAD-service segments, speaker_verify assigns labels
  - speaker_verify   # /embed service clustering
  - multi_transcribe # ASR via service
  - align            # forced alignment via service
  - consensus
  - filter
  - write_manifest

output_dir: ${oc.env:DATA_DIR,/home/samdv/DATA/crawl-2026}
device: cpu          # orchestrator does no GPU work

crawl_seed:
  seed_path: ${oc.env:DATA_DIR,/home/samdv/DATA/crawl-2026}/_seed/seed.jsonl

vad:
  backend: service
  device: cpu
  enable_prefilter: true
  min_speech_ratio: 0.1
  enable_trim: true
  trim_pad_s: 0.1
  min_gap_s: 0.2
  min_duration: 1.0
  max_duration: 30.0
  backend_kwargs:
    base_url: ${oc.env:VAD_URL,http://vad:9001}

diarize:
  backend: vad_sv                       # URL-only: no in-process diarizer
  embed_url: ${oc.env:EMBED_URL,http://speaker-embed:2010}
  detect_overlap: true
  overlap_min_s: 0.25

speaker_verify:
  enabled: true
  url: ${oc.env:EMBED_URL,http://speaker-embed:2010}
  cluster_threshold: 0.45
  ambiguous_max: 0.30
  drop_ambiguous: true

align:
  backend: service
  language: Vietnamese
  device: cpu
  text_field: text_itn
  backend_kwargs:
    base_url: ${oc.env:ALIGN_URL,http://align-mms:9203}

consensus:
  tolerance_s: 0.15
  min_overlap_iou: 0.4
  require_asr_agreement: true
  min_alignment_score: 0.7
  drop_on_disagreement: true

gender:
  url: ${oc.env:GENDER_URL,http://gender:8000}
  model: ensemble
  timeout: 30

manifest:
  output_filename: manifest.jsonl
  text_field: text_itn
  shard_by: platform

stage_configs:
  multi_transcribe:
    ensemble_strategy: single
    backends:
      - name: openai_transcription
        enabled: true
        kwargs:
          base_url: ${oc.env:ASR_URL,http://asr-funasr:9102}
          language: vi
