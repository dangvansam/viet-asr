name: viet-asr
services:
  server:
    image: viet-asr:latest
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - 8000:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
