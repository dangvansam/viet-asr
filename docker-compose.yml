services:
  vietasr-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: vietasr-server:latest
    container_name: vietasr-server
    ports:
      - "${VIETASR_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
